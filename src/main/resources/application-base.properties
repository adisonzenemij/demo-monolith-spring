# Crear tablas desde cero al arrancar
# spring.jpa.hibernate.ddl-auto=create
# Crear tablas al inicio y eliminarlas al cerrar
# spring.jpa.hibernate.ddl-auto=create-drop
# No modificar esquema de la base de datos
# spring.jpa.hibernate.ddl-auto=none
# Actualizar estructura sin eliminar datos
spring.jpa.hibernate.ddl-auto=update
# Verificar el esquema sin modificar datos
# spring.jpa.hibernate.ddl-auto=validate
# Evitar el error 'LazyInitializationException'
spring.jpa.open-in-view=false
# Dialecto por defecto para el uso de Hibernate
spring.jpa.properties.hibernate.dialect=true
# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
# Ubicación del archivo SQL de inicialización con consultas
spring.sql.init.data-locations=classpath:database.dev.sql
# Formato des fecha en la aplicación
spring.mvc.format.date=yyyy-MM-dd
# ---------- Final Data Properties ----------





# ---------- Start HikariCP ----------
# Nombre identificador del pool (aparece en logs/metrics)
spring.datasource.hikari.pool-name=appPool
# Máximo de conexiones simultáneas en el pool (sube/baja según tu BD y carga)
spring.datasource.hikari.maximum-pool-size=200
# Conexiones mínimas en reposo que Hikari mantiene listas (warm)
spring.datasource.hikari.minimum-idle=20
# Tiempo máximo (ms) que una solicitud esperará una conexión antes de fallar
spring.datasource.hikari.connection-timeout=2000
# Tiempo máximo (ms) para validar una conexión (health check) antes de fallar
spring.datasource.hikari.validation-timeout=2000
# Tiempo (ms) que una conexión puede estar ociosa antes de ser elegible para cierre
spring.datasource.hikari.idle-timeout=600000
# Vida útil máxima (ms) de una conexión antes de reciclarla (previene cortes por la BD)
spring.datasource.hikari.max-lifetime=1800000
# Intervalo (ms) para enviar pings de keepalive y evitar cierres por inactividad agresiva
spring.datasource.hikari.keepalive-time=300000
# Si una conexión permanece prestada más de este tiempo (ms), loguea posible fuga
spring.datasource.hikari.leak-detection-threshold=20000
# ---------- Final HikariCP ----------





# ---------- Start Actuator / Métricas ----------
# Expone endpoints de Actuator (útil para ver métricas y el pool)
management.endpoints.web.exposure.include=health,info,metrics,threaddump,prometheus
# Muestra detalles de health en prod suele restringirse
management.endpoint.health.show-details=always
# ---------- Final Actuator / Métricas ----------





# ---------- Start Tomcat Embebido ----------
# Hilos máximos de procesamiento de peticiones en el Tomcat embebido
server.tomcat.threads.max=500
# Cola de peticiones cuando todos los hilos están ocupados (backlog/espera)
server.tomcat.accept-count=2000
# Conexiones concurrentes que el conector puede sostener (nivel socket)
server.tomcat.max-connections=10000
# Tiempo de espera para la 1ª línea de la petición y actividad de I/O
server.tomcat.connection-timeout=20s
# Tiempo máx. que una conexión keep-alive se mantiene abierta sin nuevas peticiones
server.tomcat.keep-alive-timeout=20s
# Máx. peticiones permitidas por conexión keep-alive (−1 = ilimitado)
server.tomcat.max-keep-alive-requests=100
# ---------- Final Tomcat Embebido ----------





# ---------- Start Server Properties ----------
# Puerto del servidor
server.port=8159
# Puerto del servidor
# server.port=${DV_SRV_PORT}
# ---------- Final Server Properties ----------





# ---------- Start Redis Properties ----------
# Redis Enable Caching
spring.cache.type=redis
# Host del servidor
spring.data.redis.host=127.0.0.1
# Puerto del servidor
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=5s
# ---------- Final Redis Properties ----------
